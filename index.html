<style>
:root{--bg:#F6F7F5;--card:#fff;--tx:#202522;--sub:#747A76;--main:#174A43;--pt:#B8C96B;--line:#E3E6E3;--off:#D9DCDA;--tint:#EEF2E2;--sh:0 1px 2px rgba(23,74,67,.06),0 8px 22px rgba(23,74,67,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px 0}

@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 4px}h2{font-size:16px;margin:22px 0 8px}
.hi{color:var(--sub);margin:0 0 18px}
.card{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--sh);transition:transform .12s}
.tap{cursor:pointer}.tap:active{transform:scale(.985)}
.sub{color:var(--sub);font-size:13px}
button{font:inherit;font-weight:600;border:0;border-radius:16px;padding:15px 16px;width:100%;margin-top:10px;cursor:pointer;background:var(--main);color:#fff;transition:transform .12s,opacity .12s}
button:active{transform:scale(.98);opacity:.92}
button.ghost{background:#fff;color:var(--main);box-shadow:var(--sh)}
button.link{background:none;color:var(--sub);width:auto;padding:8px 0;font-weight:500;box-shadow:none}
button:disabled{background:var(--off)}
input,select,textarea{font:inherit;width:100%;padding:14px;border:1.5px solid transparent;border-radius:14px;background:#fff;box-shadow:var(--sh);margin:6px 0 14px;outline:0}
input:focus,textarea:focus{border-color:var(--pt)}
.seg{display:flex;gap:8px;margin:6px 0 14px}.seg div{flex:1;text-align:center;padding:12px 4px;border-radius:14px;background:#fff;box-shadow:var(--sh);cursor:pointer;transition:background .15s}
.seg .on{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--pt);color:var(--main);font-weight:600}

.grow{flex:1}

.bar button:first-child{margin-top:0}
.hero{background:var(--main);color:#fff;box-shadow:0 10px 26px rgba(23,74,67,.28)}
.hero .sub{color:#cfe0c0}
.logo{width:96px;height:96px;border-radius:24px;display:block;margin:0 auto 16px;box-shadow:var(--sh)}
.mid{margin:auto 0}.center{text-align:center}
#pop{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
#pop div{background:#fff;border-radius:20px;padding:20px;max-width:340px;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:#fff;box-shadow:0 -6px 22px rgba(23,74,67,.08);padding-bottom:env(safe-area-inset-bottom);border-radius:20px 20px 0 0;z-index:5}
.nav div{flex:1;text-align:center;padding:15px 0;color:var(--sub);cursor:pointer}.nav .on{color:var(--main);font-weight:700}
.sm{width:auto!important;margin:0!important;padding:9px 15px!important}
.list{background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);min-height:42px}.li:last-child{border:0}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.li .tm{color:var(--sub);font-size:13px;white-space:nowrap}.li .pill{font-size:11px;padding:2px 8px;white-space:nowrap}
.li .tm{width:92px;text-align:center;font-variant-numeric:tabular-nums}.li .ps{display:inline-block;width:58px;text-align:center;padding:2px 0}.nm .pill{margin-left:6px}
.av.s{width:28px;height:28px;border-radius:9px;font-size:13px}
.gr{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}.gr:last-child{border:0}
.gr .ct{width:34px;margin-right:24px;color:var(--sub);font-size:12px}.gr .vs{width:20px;margin:0 16px 0 6px;color:var(--sub);font-size:11px;text-align:center}
.tg{display:grid;grid-template-columns:repeat(2,4em);font-size:14px}.tg span,.rest span[data-a]{cursor:pointer}.sel{background:var(--pt)!important;border-radius:6px}.still{animation:none!important}
.rest{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:7px 12px;font-size:13px;color:#B4B9B5;background:#FBFCFA}.rest span[data-a]{padding:1px 7px;border-radius:6px;background:#F3F5F2;color:#9EA39F}
#popmsg{white-space:pre-line}
.gr.s{padding:7px 10px;flex-wrap:nowrap}.gr.s .ct{width:32px;margin-right:14px;flex:none;white-space:nowrap}.gr.s .vs{width:16px;margin:0 6px 0 4px;flex:none}
.gr.s .tg{grid-template-columns:repeat(2,3.5em);font-size:13px;flex:none}.gr.s .sc{margin-left:auto;white-space:nowrap;flex:none;padding-left:8px}
.gr.tap{cursor:pointer}.gr.tap:active{background:var(--tint)}.gr .sc{margin-left:auto}
.gt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pr{display:flex;align-items:flex-start;gap:4px}.pc{flex:1;min-width:0}.pc select,.pc input{width:100%}.pp{width:34px;text-align:center;padding:3px 0!important;margin-top:9px;cursor:pointer;flex:none}
.cmp input{padding:9px 10px;margin:4px 0 8px;font-size:14px}.cmp .big{width:84px;font-size:22px;text-align:center;padding:8px;font-weight:600}.tg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;text-align:left}
.rh{padding:6px 12px;background:var(--tint);color:var(--main);font-weight:600;font-size:13px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:0 6px;padding:8px 12px;margin-top:6px}.pg>div{display:flex;padding:4px 0;font-size:13px;white-space:nowrap;cursor:pointer;min-width:0}.pg .n{overflow:hidden;text-overflow:ellipsis;min-width:0}.pg span{flex:none;color:var(--sub);font-variant-numeric:tabular-nums}
.sh{position:fixed;inset:0;background:#0005;z-index:8;display:flex;align-items:flex-end}.sh>div{background:#fff;width:100%;max-width:480px;margin:0 auto;max-height:72vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 4px;font-size:18px}.sh .k{margin:12px 0 4px;font-size:13px;color:var(--sub)}.sh .ch{display:flex;flex-wrap:wrap;gap:6px}.sh .ch span{background:var(--tint);color:var(--main);padding:3px 10px;border-radius:99px;font-size:13px}
.sh .gl{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.sh .gl:last-child{border:0}.sh .gl .t{width:96px;flex:none;color:var(--sub)}
.cmp select{padding:9px 10px;margin:4px 0 8px;font-size:14px}.cmp .seg{margin:4px 0 8px}.cmp .seg div{padding:8px 4px;font-size:14px}.cmp .chips div{flex:none;padding:6px 12px}
.cmp button{padding:10px;margin-top:6px;font-size:14px}.cmp h2{margin:16px 0 4px;font-size:15px}.cmp .li{min-height:34px;padding:5px 12px}.cmp .bar button{padding:13px;font-size:15px}
.pgm{padding:9px 14px;border-bottom:1px solid var(--line)}.pgm:last-child{border:0}.pgm .sub{font-size:12px}.pgm .gr{padding:2px 0 0!important;border:0!important}
.gr.s.p .tg{flex:1;min-width:0;grid-template-columns:1fr 1fr;font-size:14px}.gr.s.p .vs{width:18px;margin:0 10px}
.pv{width:100%;max-height:110px;object-fit:contain;background:#EEF0EC;border-radius:10px;margin:4px 0 8px;cursor:zoom-in}
.spin{width:44px;height:44px;border:4px solid var(--tint);border-top-color:var(--main);border-radius:50%;margin:0 auto 16px;animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:5px;padding:2px 0 8px}.tabs span{flex:1 1 auto;text-align:center;white-space:nowrap;padding:6px 3px;font-size:13px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:13px;cursor:pointer}.tabs .on{background:var(--main);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tgrid span{text-align:center;padding:8px 4px;border-radius:12px;background:var(--bg);color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tgrid .on{background:var(--main);color:#fff}.tgrid .lk{background:var(--tint);color:var(--main);cursor:default}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r2 label{font-size:12px;color:var(--sub)}.cmp .r2 input{margin:2px 0 8px;padding:7px 9px;font-size:14px}
.cmp .seg.xs{margin:0}.cmp .seg.xs div{padding:6px 4px;font-size:13px}.dz{background:#FFF3F0;box-shadow:none;border:1px solid #F3C9C0}
.seg.hl .on{background:var(--main);color:#fff;box-shadow:none}
.sh .r2 input{margin:2px 0 8px;padding:7px 9px;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.pills span{padding:7px 15px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:15px;cursor:pointer}.pills span:active{background:var(--tint)}
.nv{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:var(--sh);cursor:pointer;font-size:18px}
.mc{flex:none;text-align:center;display:inline-block}.mc .pill{white-space:nowrap}
.link.bk{font-size:16px;font-weight:600;color:var(--main);padding:8px 8px 8px 0;display:flex;align-items:center;margin-top:0}.link.bk .ar{font-size:30px;line-height:1;margin-right:8px;font-weight:400}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"><div><p id="popmsg"></p><button id="popok">확인</button><button class="ghost" id="popno" style="display:none">취소</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,getDocs,writeBatch,serverTimestamp,limit,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getAI,getGenerativeModel,GoogleAIBackend} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";
import {initializeAppCheck,ReCaptchaEnterpriseProvider} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js";
import {firebaseConfig} from "./firebase-config.js";
import * as CFG from "./firebase-config.js";

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAX_CREATE=2, MAX_JOIN=10;
const S={user:null,profile:null,screen:"login",clubs:[],found:[],form:{vis:"public",join:"open",pos:"either",play:"play",np:"1",days:[]},cur:null,tab:"today",pmo:null,pe:null,soff:[],ms:null,ph:null,pg:[],pp:[],pclubs:[],ptab:"home",pq:"",pd:null,sd:null,games:[],ap:[],ge:null,sel:null,mdt:null,still:0,dr:null,sess:null,parts:[],mem:[],apps:[]};
let auth,db,app;const AI_MODEL="gemini-3.5-flash";

function pop(msg){$("#popmsg").textContent=msg;$("#pop").style.display="flex"}
const base=()=>$("#pop").style.display="none";$("#popok").onclick=base;
const ask=(m,ok="확인",no="취소")=>new Promise(r=>{$("#popmsg").textContent=m;$("#popok").textContent=ok;$("#popno").textContent=no;$("#popno").style.display="block";$("#pop").style.display="flex";const d=v=>{base();$("#popok").textContent="확인";$("#popno").style.display="none";$("#popok").onclick=base;r(v)};$("#popok").onclick=()=>d(true);$("#popno").onclick=()=>d(false)});
const ROOT=["login","name","mode"];
const go=async(screen,extra={})=>{Object.assign(S,extra,{screen});if(!ROOT.includes(screen)&&!(history.state&&history.state.r===2))history.pushState({r:2},"");if(screen!=="login"&&screen!=="name")localStorage.setItem("cm_screen",screen==="clubHome"?"clubs":screen);render()};

try{ app=initializeApp(firebaseConfig);if(CFG.appCheckKey)try{initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(CFG.appCheckKey),isTokenAutoRefreshEnabled:true})}catch(e){console.warn(e)}auth=getAuth(app);db=getFirestore(app); }catch(e){ $("#app").innerHTML="<h1>설정 필요</h1><p>firebase-config.js 를 확인하세요.</p>"; }
if(auth) onAuthStateChanged(auth,async u=>{
  S.user=u; if(!u){S.profile=null;return go("login")}
  const snap=await getDoc(doc(db,"users",u.uid));
  if(!snap.exists()){S.profile={name:u.displayName||""};return go("name")}
  S.profile=snap.data();
  const m=localStorage.getItem("cm_mode"); if(m==="club")return openClubs(); if(m==="personal")return A.modePersonal(); go("mode");
});

async function openClubs(){
  await go("clubs");
  const ms=await getDocs(query(collection(db,"clubMembers"),where("uid","==",S.user.uid),where("status","==","active")));
  const list=[];
  for(const m of ms.docs){const c=await getDoc(doc(db,"clubs",m.data().clubId)); if(c.exists())list.push({id:c.id,role:m.data().role,...c.data()})}
  S.clubs=list; render();
}
async function load(){const c=S.cur,id=c.id,q=(n,...w)=>getDocs(query(collection(db,n),...w.map(([f,v])=>where(f,"==",v)))).then(r=>r.docs.map(d=>({...d.data(),_id:d.id})));
 if(S.tab==="today"){const m=nextMeeting(c);S.parts=m?await q("sessionParticipants",["clubId",id],["date",ymd(m.date)]):[];S.sess=null;S.sessMeta=null;S.mem=await q("clubMembers",["clubId",id],["status","active"]);
  if(m)try{const d=await getDoc(doc(db,"sessions",`${id}_${ymd(m.date)}`));const x=d.exists()?d.data():null;S.sessMeta=x;S.sess=x&&x.rounds?x:null}catch(e){}}
 if(S.tab==="settings")S.mem=await q("clubMembers",["clubId",id],["status","active"]);
 if(S.tab==="stats"||S.tab==="games")S.ap=await q("sessionParticipants",["clubId",id]);
 if(S.tab==="games"||S.tab==="stats"){const m=nextMeeting(c);S.mem=await q("clubMembers",["clubId",id],["status","active"]);S.sess=null;
  if(m)try{const d=await getDoc(doc(db,"sessions",`${id}_${ymd(m.date)}`));const x=d.exists()?d.data():null;S.sessMeta=x;S.sess=x&&x.rounds?x:null}catch(e){}
  S.games=(await q("games",["clubId",id])).sort((a,b)=>b.date.localeCompare(a.date)||(b.round||0)-(a.round||0)||(a.court||0)-(b.court||0))}
 if(S.tab==="members"){S.mem=await q("clubMembers",["clubId",id],["status","active"]);S.apps=can("members")?await q("clubApplications",["clubId",id],["status","pending"]):[]}
 render()}
async function archiveClosed(clubs){const u=S.user.uid,ar={...(S.profile.archived||{})},sy=S.profile.sync||{};let ch=false;
 for(const c of clubs)if(c.status==="closed"&&sy[c.id]&&!ar[c.id]){const gs=(await getDocs(query(collection(db,"games"),where("clubId","==",c.id)))).docs.map(d=>({id:d.id,...d.data()})).filter(g=>[...g.t1,...g.t2].some(p=>p.k===u));
  for(const g of gs){const f=g.t1.some(p=>p.k===u);await setDoc(doc(db,"personalGames",`${u}_k_${g.id}`),{ownerUid:u,date:g.date,sourceType:"other",label:c.name,t1:mf(f?g.t1:g.t2,u),t2:f?g.t2:g.t1,scoreA:f?g.scoreA:g.scoreB,scoreB:f?g.scoreB:g.scoreA,note:"",clubId:c.id,createdAt:serverTimestamp()})}
  ar[c.id]=true;ch=true}
 if(ch){S.profile.archived=ar;await updateDoc(doc(db,"users",u),{archived:ar}).catch(()=>{})}}
const loadClubs=async()=>{const ms=await getDocs(query(collection(db,"clubMembers"),where("uid","==",S.user.uid),where("status","==","active"))),l=[];for(const m of ms.docs){const c=await getDoc(doc(db,"clubs",m.data().clubId));if(c.exists())l.push({id:c.id,...c.data()})}return l};
async function pLoad(){const u=S.user.uid,clubs=await loadClubs(),sync=S.profile.sync||{},q=(n,f,v)=>getDocs(query(collection(db,n),where(f,"==",v))).then(r=>r.docs.map(d=>({id:d.id,...d.data()})));
 S.pclubs=clubs;await archiveClosed(clubs);const [own,pe]=await Promise.all([q("personalGames","ownerUid",u),q("personalPeople","ownerUid",u)]);S.pp=pe;const notes={},out=[];
 own.forEach(g=>{if(g.sourceType==="club")notes[g.clubGameId]=g;else out.push({...g,src:"own",label:g.label||"기타",docId:g.id})});
 for(const c of clubs)if(sync[c.id]&&c.status!=="closed")(await q("games","clubId",c.id)).filter(g=>[...g.t1,...g.t2].some(p=>p.k===u)).forEach(g=>{const f=g.t1.some(p=>p.k===u),n=notes[g.id];out.push({id:"c_"+g.id,src:"club",clubGameId:g.id,clubId:c.id,label:c.name,date:g.date,t1:mf(f?g.t1:g.t2,u),t2:f?g.t2:g.t1,scoreA:f?g.scoreA:g.scoreB,scoreB:f?g.scoreB:g.scoreA,note:n?n.note:"",docId:n?n.id:null})});
 S.pg=out.sort((a,b)=>b.date.localeCompare(a.date));render()}
const mf=(t,u)=>t[0].k===u?t:[t[1],t[0]];
const created=()=>S.clubs.filter(c=>c.createdBy===S.user.uid&&c.status!=="closed").length;
const joined=()=>S.clubs.filter(c=>c.status!=="closed").length-created();
const code=()=>Array.from({length:7},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");

const PLB=[["포","백"],["백","포"],["–","–"]],PSM=[["fore","back"],["back","fore"],["either","either"]];
const STATK=[["att","출석"],["gm","경기수"],["win","승률"],["mw","최다승"],["st","최장 연승"],["pr","페어"],["dpa","파트너별(상세)"],["dop","상대별(상세)"],["dps","포/백별(상세)"]];
const mid=m=>m.uid||m.oid,mkey=m=>m.uid||"o:"+m.oid;
const POS={fore:"포",back:"백",either:"포or백"},DOW="일월화수목금토";
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const isSt=()=>["admin","staff"].includes(S.cur.role);
function eff(c){const m=nextMeeting(c)||{};return{start:m.start||c.regularStartTime||"13:00",end:m.end||c.regularEndTime||"16:00",courts:m.courts||c.regularCourtCount||3,iv:c.roundInterval||40}}
function nextMeeting(c){const days=c.regularDays||[],n=new Date(),ov=c.mtgOverride||null,td=ymd(n);let reg=null,ex=null;
 for(let i=0;i<30&&!reg;i++){const x=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(days.includes(x.getDay())&&!(ov&&ov.from===ymd(x)))reg={date:x,today:i===0}}
 if(ov&&!ov.off&&ov.date&&ov.date>=td){const d=ov.date;ex={date:new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6)),today:d===td,start:ov.start,end:ov.end,courts:ov.courts,memo:ov.memo||""}}
 return ex&&(!reg||ymd(ex.date)<=ymd(reg.date))?ex:reg}
const btn=(a,id,t,g)=>`<button class="sm ${g?"ghost":""}" data-a="${a}" data-id="${id}">${t}</button>`;

  const {iv,st}=rinfo(S.cur),cx=R=>{const o=new Set();R.forEach((r,ri)=>{const t=st+ri*iv,seen={};r.games.forEach(g=>{[...g.t1,...g.t2].forEach(x=>{if(seen[x.k])o.add(x.n+" 같은 회차 중복");seen[x.k]=1;const p=S.parts.find(q=>key(q)===x.k);if(p&&!(tmin(p.start)<=t&&tmin(p.end)>=t+iv))o.add(x.n+" 참석 시간 밖");if((S.dr.excl[x.k]||[]).includes(r.n))o.add(x.n+" 제외 회차")});S.dr.pairs.forEach(([p,q])=>[g.t1,g.t2].forEach(m=>{const ks=m.map(x=>x.k);if(ks.includes(p)!==ks.includes(q))o.add("고정 페어 분리")}))})});return[...o]};
  const bef=new Set(cx(S.dr.plan.rounds)),add=cx(rs).filter(x=>!bef.has(x));
  if(add.length&&!await ask("조건 충돌\n"+add.slice(0,4).join("\n")+"\n그래도 변경할까요?"))return rr();
  S.dr.plan.rounds=rs;rr()},
