<html lang="ko">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#F6F7F5;--card:#fff;--tx:#202522;--sub:#747A76;--main:#174A43;--pt:#B8C96B;--line:#E3E6E3;--off:#D9DCDA;--tint:#EEF2E2;--sh:0 1px 2px rgba(23,74,67,.06),0 8px 22px rgba(23,74,67,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px 0}

@media(prefers-reduced-motion:reduce){.scr{animation:none}}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 4px}h2{font-size:16px;margin:22px 0 8px}
.hi{color:var(--sub);margin:0 0 18px}
.card{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--sh);transition:transform .12s}
.tap{cursor:pointer}.tap:active{transform:scale(.985)}
.sub{color:var(--sub);font-size:13px}
button{font:inherit;font-weight:600;border:0;border-radius:16px;padding:15px 16px;width:100%;margin-top:10px;cursor:pointer;background:var(--main);color:#fff;transition:transform .12s,opacity .12s}
button:active{transform:scale(.98);opacity:.92}
button.ghost{background:#fff;color:var(--main);box-shadow:var(--sh)}
button.link{background:none;color:var(--sub);width:auto;padding:8px 0;font-weight:500;box-shadow:none}
button:disabled{background:var(--off)}
input,select,textarea{font:inherit;width:100%;padding:14px;border:1.5px solid transparent;border-radius:14px;background:#fff;box-shadow:var(--sh);margin:6px 0 14px;outline:0}
input:focus,textarea:focus{border-color:var(--pt)}
.seg{display:flex;gap:8px;margin:6px 0 14px}.seg div{flex:1;text-align:center;padding:12px 4px;border-radius:14px;background:#fff;box-shadow:var(--sh);cursor:pointer;transition:background .15s}
.seg .on{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--pt);color:var(--main);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--main);font-weight:600}
.av{width:42px;height:42px;border-radius:14px;background:var(--tint);color:var(--main);display:grid;place-items:center;font-weight:700;flex:none}
.grow{flex:1}
.bar{position:sticky;bottom:0;margin:auto -18px 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(246,247,245,0))}
.bar button:first-child{margin-top:0}
.hero{background:var(--main);color:#fff;box-shadow:0 10px 26px rgba(23,74,67,.28)}
.hero .sub{color:#cfe0c0}
.logo{width:96px;height:96px;border-radius:24px;display:block;margin:0 auto 16px;box-shadow:var(--sh)}
.mid{margin:auto 0}.center{text-align:center}
#pop{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
#pop div{background:#fff;border-radius:20px;padding:20px;max-width:340px;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:#fff;box-shadow:0 -6px 22px rgba(23,74,67,.08);padding-bottom:env(safe-area-inset-bottom);border-radius:20px 20px 0 0;z-index:5}
.nav div{flex:1;text-align:center;padding:15px 0;color:var(--sub);cursor:pointer}.nav .on{color:var(--main);font-weight:700}
.sm{width:auto!important;margin:0!important;padding:9px 15px!important}
.list{background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);min-height:42px}.li:last-child{border:0}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.li .tm{color:var(--sub);font-size:13px;white-space:nowrap}.li .pill{font-size:11px;padding:2px 8px;white-space:nowrap}
.li .tm{width:92px;text-align:center;font-variant-numeric:tabular-nums}.li .ps{display:inline-block;width:58px;text-align:center;padding:2px 0}.nm .pill{margin-left:6px}
.av.s{width:28px;height:28px;border-radius:9px;font-size:13px}
.gr{display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}.gr:last-child{border:0}
.gr .ct{width:34px;margin-right:24px;color:var(--sub);font-size:12px}.gr .vs{width:20px;margin:0 16px 0 6px;color:var(--sub);font-size:11px;text-align:center}
.tg{display:grid;grid-template-columns:repeat(2,4em);font-size:14px}.tg span,.rest span[data-a]{cursor:pointer}.sel{background:var(--pt)!important;border-radius:6px}.still{animation:none!important}
.rest{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:7px 12px;font-size:13px;color:#B4B9B5;background:#FBFCFA}.rest span[data-a]{padding:1px 7px;border-radius:6px;background:#F3F5F2;color:#9EA39F}
#popmsg{white-space:pre-line}
.gr.s{padding:7px 10px;flex-wrap:nowrap}.gr.s .ct{width:32px;margin-right:14px;flex:none;white-space:nowrap}.gr.s .vs{width:16px;margin:0 6px 0 4px;flex:none}
.gr.s .tg{grid-template-columns:repeat(2,3.5em);font-size:13px;flex:none}.gr.s .sc{margin-left:auto;white-space:nowrap;flex:none;padding-left:8px}
.gr.tap{cursor:pointer}.gr.tap:active{background:var(--tint)}.gr .sc{margin-left:auto}
.gt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pr{display:flex;align-items:flex-start;gap:4px}.pc{flex:1;min-width:0}.pc select,.pc input{width:100%}.pp{width:34px;text-align:center;padding:3px 0!important;margin-top:9px;cursor:pointer;flex:none}
.cmp input{padding:9px 10px;margin:4px 0 8px;font-size:14px}.cmp .big{width:84px;font-size:22px;text-align:center;padding:8px;font-weight:600}.tg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;text-align:left}
.rh{padding:6px 12px;background:var(--tint);color:var(--main);font-weight:600;font-size:13px}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:0 6px;padding:8px 12px;margin-top:6px}.pg>div{display:flex;padding:4px 0;font-size:13px;white-space:nowrap;cursor:pointer;min-width:0}.pg .n{overflow:hidden;text-overflow:ellipsis;min-width:0}.pg span{flex:none;color:var(--sub);font-variant-numeric:tabular-nums}
.sh{position:fixed;inset:0;background:#0005;z-index:8;display:flex;align-items:flex-end}.sh>div{background:#fff;width:100%;max-width:480px;margin:0 auto;max-height:72vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 4px;font-size:18px}.sh .k{margin:12px 0 4px;font-size:13px;color:var(--sub)}.sh .ch{display:flex;flex-wrap:wrap;gap:6px}.sh .ch span{background:var(--tint);color:var(--main);padding:3px 10px;border-radius:99px;font-size:13px}
.sh .gl{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.sh .gl:last-child{border:0}.sh .gl .t{width:96px;flex:none;color:var(--sub)}
.cmp select{padding:9px 10px;margin:4px 0 8px;font-size:14px}.cmp .seg{margin:4px 0 8px}.cmp .seg div{padding:8px 4px;font-size:14px}.cmp .chips div{flex:none;padding:6px 12px}
.cmp button{padding:10px;margin-top:6px;font-size:14px}.cmp h2{margin:16px 0 4px;font-size:15px}.cmp .li{min-height:34px;padding:5px 12px}.cmp .bar button{padding:13px;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"><div><p id="popmsg"></p><button id="popok">확인</button><button class="ghost" id="popno" style="display:none">취소</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,getDocs,writeBatch,serverTimestamp,limit,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAX_CREATE=2, MAX_JOIN=10;
const S={user:null,profile:null,screen:"login",clubs:[],found:[],form:{vis:"public",join:"open",pos:"either",play:"play",np:"1",days:[]},cur:null,tab:"today",sd:null,games:[],ap:[],ge:null,sel:null,mdt:null,still:0,dr:null,sess:null,parts:[],mem:[],apps:[]};
let auth,db;

function pop(msg){$("#popmsg").textContent=msg;$("#pop").style.display="flex"}
const base=()=>$("#pop").style.display="none";$("#popok").onclick=base;
const ask=m=>new Promise(r=>{$("#popmsg").textContent=m;$("#popno").style.display="block";$("#pop").style.display="flex";const d=v=>{base();$("#popno").style.display="none";$("#popok").onclick=base;r(v)};$("#popok").onclick=()=>d(true);$("#popno").onclick=()=>d(false)});
const go=async(screen,extra={})=>{Object.assign(S,extra,{screen});if(screen!=="login"&&screen!=="name")localStorage.setItem("cm_screen",screen==="clubHome"?"clubs":screen);render()};

try{ auth=getAuth(initializeApp(firebaseConfig)); db=getFirestore(); }catch(e){ $("#app").innerHTML="<h1>설정 필요</h1><p>firebase-config.js 를 확인하세요.</p>"; }
if(auth) onAuthStateChanged(auth,async u=>{
  S.user=u; if(!u){S.profile=null;return go("login")}
  const snap=await getDoc(doc(db,"users",u.uid));
  if(!snap.exists()){S.profile={name:u.displayName||""};return go("name")}
  S.profile=snap.data();
  const m=localStorage.getItem("cm_mode"); if(m==="club")return openClubs(); if(m==="personal")return go("personal"); go("mode");
});

async function openClubs(){
  await go("clubs");
  const ms=await getDocs(query(collection(db,"clubMembers"),where("uid","==",S.user.uid),where("status","==","active")));
  const list=[];
  for(const m of ms.docs){const c=await getDoc(doc(db,"clubs",m.data().clubId)); if(c.exists())list.push({id:c.id,role:m.data().role,...c.data()})}
  S.clubs=list; render();
}
async function load(){const c=S.cur,id=c.id,q=(n,...w)=>getDocs(query(collection(db,n),...w.map(([f,v])=>where(f,"==",v)))).then(r=>r.docs.map(d=>d.data()));
 if(S.tab==="today"){const m=nextMeeting(c);S.parts=m?await q("sessionParticipants",["clubId",id],["date",ymd(m.date)]):[];S.sess=null;
  if(m)try{const d=await getDoc(doc(db,"sessions",`${id}_${ymd(m.date)}`));S.sess=d.exists()?d.data():null}catch(e){}}
 if(S.tab==="stats"||S.tab==="games")S.ap=await q("sessionParticipants",["clubId",id]);
 if(S.tab==="games"||S.tab==="stats"){const m=nextMeeting(c);S.mem=await q("clubMembers",["clubId",id],["status","active"]);S.sess=null;
  if(m)try{const d=await getDoc(doc(db,"sessions",`${id}_${ymd(m.date)}`));S.sess=d.exists()?d.data():null}catch(e){}
  S.games=(await q("games",["clubId",id])).sort((a,b)=>b.date.localeCompare(a.date)||(b.round||0)-(a.round||0)||(a.court||0)-(b.court||0))}
 if(S.tab==="members"){S.mem=await q("clubMembers",["clubId",id],["status","active"]);S.apps=c.role==="admin"?await q("clubApplications",["clubId",id],["status","pending"]):[]}
 render()}
const created=()=>S.clubs.filter(c=>c.createdBy===S.user.uid).length;
const joined=()=>S.clubs.length-created();
const code=()=>Array.from({length:7},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");

const POS={fore:"포",back:"백",either:"포or백"},DOW="일월화수목금토";
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const isSt=()=>["admin","staff"].includes(S.cur.role);
function nextMeeting(c){const days=c.regularDays||[],n=new Date();if(!days.length)return null;for(let i=0;i<8;i++){const x=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(days.includes(x.getDay()))return{date:x,today:i===0}}}
const btn=(a,id,t,g)=>`<button class="sm ${g?"ghost":""}" data-a="${a}" data-id="${id}">${t}</button>`;
const key=p=>p.uid||"g:"+p.name,tmin=x=>x.split(":").reduce((a,b)=>a*60+ +b),fmt=m=>String(m/60|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const rinfo=c=>{const iv=c.roundInterval||40,st=tmin(c.regularStartTime||"13:00"),en=tmin(c.regularEndTime||"16:00");return{iv,st,R:Math.max(1,Math.floor((en-st)/iv))}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function buildDraw(parts,c,dr){
 const {iv,st,R}=rinfo(c),cts=c.regularCourtCount||3,pl=parts.filter(p=>p.status==="in"&&!p.noPlay).map(p=>({k:key(p),n:p.name,p:p.position,s:tmin(p.start),e:tmin(p.end),g:0}));
 const pc={},oc={},K=(a,b)=>a<b?a+"|"+b:b+"|"+a,cnt=(m,a,b)=>m[K(a,b)]||0,inc=(m,a,b)=>m[K(a,b)]=cnt(m,a,b)+1,rounds=[];
 for(let r=0;r<R;r++){
  const t=st+r*iv,av=pl.filter(p=>p.s<=t&&p.e>=t+iv&&!(dr.excl[p.k]||[]).includes(r+1)),by=Object.fromEntries(av.map(p=>[p.k,p])),used=new Set();
  let units=[];dr.pairs.forEach(([a,b])=>{if(by[a]&&by[b]){units.push([by[a],by[b]]);used.add(a);used.add(b)}});
  av.forEach(p=>{if(!used.has(p.k))units.push([p])});
  const avg=u=>u.reduce((x,p)=>x+p.g,0)/u.length;units=shuf(units).sort((x,y)=>avg(x)-avg(y));
  let sel=[],tot=0;for(const u of units)if(tot+u.length<=cts*4){sel.push(u);tot+=u.length}
  while(tot%4){const i=sel.map(u=>u.length).lastIndexOf(1),j=i>=0?i:sel.length-1;tot-=sel[j].length;sel.splice(j,1)}
  if(!sel.length){rounds.push({n:r+1,time:fmt(t),games:[]});continue}
  const mk=()=>{const T=[],sg=[];shuf(sel).forEach(u=>u.length===2?T.push({m:[...u],f:1}):sg.push(u[0]));for(let i=0;i<sg.length;i+=2)T.push({m:[sg[i],sg[i+1]],f:0});return shuf(T)};
  const sc=T=>{let x=0;T.forEach(q=>{if(!q.f)x+=cnt(pc,q.m[0].k,q.m[1].k)*10;if(dr.mode==="pos"&&q.m[0].p===q.m[1].p&&q.m[0].p!=="either")x+=8});
   for(let i=0;i<T.length;i+=2)for(const a of T[i].m)for(const b of T[i+1].m)x+=cnt(oc,a.k,b.k)*4;return x};
  let best=mk(),bs=sc(best);
  for(let i=0;i<400;i++){let T;if(i<80)T=mk();else{T=best.map(q=>({...q,m:[...q.m]}));const a=T[Math.random()*T.length|0],b=T[Math.random()*T.length|0];if(a===b||a.f||b.f)continue;const x=Math.random()<.5?0:1,y=Math.random()<.5?0:1;[a.m[x],b.m[y]]=[b.m[y],a.m[x]]}const v=sc(T);if(v<bs){best=T;bs=v}}
  const games=[];for(let i=0;i<best.length;i+=2){const A=best[i].m,B=best[i+1].m,f=q=>q.map(p=>({k:p.k,n:p.n,p:p.p}));games.push({court:i/2+1,t1:f(A),t2:f(B)});
   inc(pc,A[0].k,A[1].k);inc(pc,B[0].k,B[1].k);A.forEach(a=>B.forEach(b=>inc(oc,a.k,b.k)));[...A,...B].forEach(p=>p.g++)}
  rounds.push({n:r+1,time:fmt(t),games});
 }
 return{rounds,players:pl.map(p=>({n:p.n,g:p.g}))};
}
const pool=()=>S.parts.filter(p=>p.status==="in"&&!p.noPlay).map(p=>({k:key(p),n:p.name,p:p.position}));
const planPlayers=rs=>{const g={};rs.forEach(r=>r.games.forEach(x=>[...x.t1,...x.t2].forEach(p=>g[p.k]=(g[p.k]||0)+1)));return pool().map(p=>({k:p.k,n:p.n,g:g[p.k]||0}))};
const cell=(x,ref,ed)=>`<span ${ed?`data-a="pick" data-s="${ref}"`:""} class="${S.sel===ref?"sel":""}">${esc(x.n)}</span>`;
const gRow=(g,ri,gi,ed)=>`<div class="gr"><span class="ct">${g.court}코트</span><div class="tg">${g.t1.map((x,i)=>cell(x,`${ri}:${gi}:1:${i}`,ed)).join("")}</div><span class="vs">vs</span><div class="tg">${g.t2.map((x,i)=>cell(x,`${ri}:${gi}:2:${i}`,ed)).join("")}</div></div>`;
const rList=(rs,ed)=>rs.map((r,ri)=>{const on=new Set(r.games.flatMap(g=>[...g.t1,...g.t2].map(x=>x.k)));const rest=ed?pool().filter(p=>!on.has(p.k)):[];
 return `<div class="list"><div class="rh">${r.n}회차 · ${r.time}</div>${r.games.map((g,gi)=>gRow(g,ri,gi,ed)).join("")||'<div class="li sub">경기 없음</div>'}${rest.length?`<div class="rest">쉼${rest.map(p=>`<span data-a="pick" data-s="${ri}:x:${esc(p.k)}" class="${S.sel===`${ri}:x:${p.k}`?"sel":""}">${esc(p.n)}</span>`).join("")}</div>`:""}</div>`}).join("");
function mSheet(){const k=S.mdt,rs=S.dr.plan.rounds,pa={},op={},gm=[],me=pool().find(p=>p.k===k);if(!me)return"";
 rs.forEach(r=>r.games.forEach(g=>{const a=g.t1.some(x=>x.k===k),b=g.t2.some(x=>x.k===k);if(!a&&!b)return;const my=a?g.t1:g.t2,ot=a?g.t2:g.t1;
  my.filter(x=>x.k!==k).forEach(x=>pa[x.n]=(pa[x.n]||0)+1);ot.forEach(x=>op[x.n]=(op[x.n]||0)+1);gm.push({r,g,my,ot})}));
 const ch=o=>Object.entries(o).sort((x,y)=>y[1]-x[1]).map(([n,c])=>`<span>${esc(n)}(${c})</span>`).join("")||'<span style="background:none;color:var(--sub)">없음</span>';
 const nm=l=>l.map(x=>x.k===k?`<b>${esc(x.n)}</b>`:esc(x.n)).join("·");
 return `<div class="sh" data-a="mclose"><div data-keep="1"><div class="row"><h3>${esc(me.n)} · ${gm.length}경기</h3><button class="link" data-a="mclose">닫기</button></div>
<div class="k">파트너</div><div class="ch">${ch(pa)}</div><div class="k">상대</div><div class="ch">${ch(op)}</div><div class="k">대진</div>
${gm.map(x=>`<div class="gl"><span class="t">${x.r.n}회차 ${x.r.time} · ${x.g.court}코트</span><span>${nm(x.my)} <span class="sub">vs</span> ${nm(x.ot)}</span></div>`).join("")||'<div class="sub">이번 대진에 경기가 없어요</div>'}</div></div>`}
const inPer=d=>{const per=S.form.per||"all",n=new Date(),y=String(n.getFullYear()),mo=n.getMonth()+1;return per==="all"||(per==="year"&&d.startsWith(y))||(per==="month"&&d.startsWith(y+String(mo).padStart(2,"0")))||(per==="quarter"&&d.startsWith(y)&&Math.ceil(+d.slice(4,6)/3)===Math.ceil(mo/3))};
function sSheet(){const k=S.sd,nmk=(x,n)=>(S.mem.find(m=>m.uid===x)||{}).displayName||n,gs=S.games.filter(g=>inPer(g.date)&&[...g.t1,...g.t2].some(p=>p.k===k)),pa={},op={},ps={fore:{g:0,w:0,d:0,l:0},back:{g:0,w:0,d:0,l:0}},T0={w:0,d:0,l:0},me0=S.mem.find(m=>m.uid===k);
 gs.forEach(g=>{const a=g.t1.some(p=>p.k===k),my=a?g.t1:g.t2,ot=a?g.t2:g.t1,r=g.scoreA===g.scoreB?"d":(g.scoreA>g.scoreB)===a?"w":"l";T0[r]++;

async saveGame(){snap();const g=S.ge,pl=[],PS=[["fore","back"],["back","fore"],["either","either"]],pp=i=>PS[g.ps[i>>1]][i&1];
  for(let i=0;i<4;i++){const n=(g.gn[i]||"").trim();if(!n)return pop("선수 4명을 모두 입력해 주세요.");const m=S.mem.find(x=>x.displayName===n);pl.push(m?{k:m.uid,n:m.displayName,p:pp(i)}:{k:"g:"+n,n,p:pp(i)})}
  if(new Set(pl.map(x=>x.k)).size<4)return pop("같은 사람이 두 번 들어갔어요.");
  const a=parseInt(g.a),b=parseInt(g.b);if(isNaN(a)||isNaN(b)||a<0||b<0)return pop("점수를 입력해 주세요.");
  const id=g.id||doc(collection(db,"games")).id,date=g.date.replace(/-/g,"");
  try{await setDoc(doc(db,"games",id),{id,clubId:S.cur.id,date,round:g.round,court:g.court,t1:pl.slice(0,2),t2:pl.slice(2),scoreA:a,scoreB:b,source:g.round?"draw":"manual",updatedBy:S.user.uid,updatedAt:serverTimestamp()});A.toClub()}catch(e){pop("저장하지 못했습니다. Firestore 규칙이 게시되었는지 확인해 주세요.")}},

async pick(el){const ref=el.dataset.s,rr=()=>{S.still=1;render();S.still=0},isR=x=>x.split(":")[1]==="x";
  if(!S.sel||S.sel===ref){S.sel=S.sel===ref?null:ref;return rr()}
  const a=S.sel;S.sel=null;
  if((isR(a)&&isR(ref))||((isR(a)||isR(ref))&&a.split(":")[0]!==ref.split(":")[0])){S.sel=ref;return rr()}
  const rs=JSON.parse(JSON.stringify(S.dr.plan.rounds)),get=x=>{const q=x.split(":");return q[1]==="x"?{...pool().find(p=>p.k===q.slice(2).join(":"))}:rs[q[0]].games[q[1]]["t"+q[2]][q[3]]},put=(x,v)=>{const q=x.split(":");if(q[1]!=="x")rs[q[0]].games[q[1]]["t"+q[2]][q[3]]=v};
  const va=get(a),vb=get(ref);put(a,vb);put(ref,va);
  const {iv,st}=rinfo(S.cur),cx=R=>{const o=new Set();R.forEach((r,ri)=>{const t=st+ri*iv,seen={};r.games.forEach(g=>{[...g.t1,...g.t2].forEach(x=>{if(seen[x.k])o.add(x.n+" 같은 회차 중복");seen[x.k]=1;const p=S.parts.find(q=>key(q)===x.k);if(p&&!(tmin(p.start)<=t&&tmin(p.end)>=t+iv))o.add(x.n+" 참석 시간 밖");if((S.dr.excl[x.k]||[]).includes(r.n))o.add(x.n+" 제외 회차")});S.dr.pairs.forEach(([p,q])=>[g.t1,g.t2].forEach(m=>{const ks=m.map(x=>x.k);if(ks.includes(p)!==ks.includes(q))o.add("고정 페어 분리")}))})});return[...o]};
  const bef=new Set(cx(S.dr.plan.rounds)),add=cx(rs).filter(x=>!bef.has(x));
  if(add.length&&!await ask("조건 충돌\n"+add.slice(0,4).join("\n")+"\n그래도 변경할까요?"))return rr();
  S.dr.plan.rounds=rs;rr()},

addPair(){const a=$("#pa").value,b=$("#pb").value;if(!a||!b||a===b)return pop("서로 다른 두 사람을 골라 주세요.");if(S.dr.pairs.some(p=>p.includes(a)||p.includes(b)))return pop("이미 다른 페어에 속한 사람입니다.");S.dr.pairs.push([a,b]);render()},

async doCreate(){const name=$("#cn").value.trim();if(!name)return pop("클럽 이름을 입력해 주세요.");
  const id=doc(collection(db,"clubs")).id,ic=code(),uid=S.user.uid,b=writeBatch(db);
  b.set(doc(db,"clubs",id),{name,meetingLocation:$("#cl").value.trim(),description:$("#cd").value.trim(),visibility:S.form.vis,joinMethod:S.form.join,primaryAdminId:uid,createdBy:uid,noPlayEnabled:true,tierEnabled:false,regularCourtCount:3,roundInterval:40,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  b.set(doc(db,"clubMembers",id+"_"+uid),{clubId:id,uid,displayName:S.profile.name,photoURL:S.user.photoURL||"",role:"admin",status:"active",defaultPosition:"either",tierId:null,joinedAt:serverTimestamp()});
  b.set(doc(db,"clubPrivate",id),{inviteCode:ic});b.set(doc(db,"inviteCodes",ic),{clubId:id});
  try{await b.commit();openClubs()}catch(e){pop("클럽을 만들지 못했습니다. Firestore 규칙이 게시되었는지 확인해 주세요.")}},

  const r=await getDocs(query(collection(db,"clubs"),where("visibility","==","public"),limit(50)));

  }catch(e){pop("가입하지 못했습니다. 이미 가입했거나 신청한 클럽일 수 있습니다.")}},
