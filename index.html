<style>

.gr.s{padding:7px 10px;flex-wrap:nowrap}.gr.s .ct{width:32px;margin-right:14px;flex:none;white-space:nowrap}.gr.s .vs{width:16px;margin:0 6px 0 4px;flex:none}
.gr.s .tg{grid-template-columns:repeat(2,3.5em);font-size:13px;flex:none}.gr.s .sc{margin-left:auto;white-space:nowrap;flex:none;padding-left:8px}

.tabs{display:flex;gap:5px;padding:2px 0 8px}.tabs span{flex:1 1 auto;text-align:center;white-space:nowrap;padding:6px 3px;font-size:13px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:13px;cursor:pointer}.tabs .on{background:var(--main);color:#fff}

.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r2 label{font-size:12px;color:var(--sub)}.cmp .r2 input{margin:2px 0 8px;padding:7px 9px;font-size:14px}
.cmp .seg.xs{margin:0}.cmp .seg.xs div{padding:6px 4px;font-size:13px}.dz{background:#FFF3F0;box-shadow:none;border:1px solid #F3C9C0}
.seg.hl .on{background:var(--main);color:#fff;box-shadow:none}
.sh .r2 input{margin:2px 0 8px;padding:7px 9px;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.pills span{padding:7px 15px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:15px;cursor:pointer}.pills span:active{background:var(--tint)}
.nv{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:var(--sh);cursor:pointer;font-size:18px}
.mc{flex:none;text-align:center;display:inline-block}.mc .pill{white-space:nowrap}
.link.bk{font-size:16px;font-weight:600;color:var(--main);padding:8px 8px 8px 0;display:flex;align-items:center;margin-top:0}.link.bk .ar{font-size:30px;line-height:1;margin-right:8px;font-weight:400}
.fl1{background:#FFF4D6;border-radius:6px}.fl2{background:#FFE0DA;border-radius:6px}
.me{background:var(--pt)!important;border-radius:6px;font-weight:700}
.pvbar{position:sticky;top:0;z-index:7;margin:-8px -18px 10px;padding:10px 18px;background:var(--main);color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}.pvbar button{width:auto;margin:0;padding:6px 14px;background:var(--pt);color:var(--main);font-size:13px}
.pills span.pon{background:var(--main);color:#fff}.cmp .pills span{font-size:14px;padding:6px 13px}
.cmp .morebar{background:none;color:var(--main);font-size:16px;font-weight:700;border-top:1px solid var(--line);border-radius:0;padding:14px 0 10px;margin:12px 0 0;box-shadow:none;width:100%}.cmp .tgrid span{font-size:14px;padding:10px 4px}
.cmp .tgrid span{background:#fff;box-shadow:var(--sh);color:var(--tx)}.cmp .tgrid .on{background:var(--main);color:#fff}
.pp.un{background:#fff;border:1.5px dashed #B8BDB9;color:#9AA09C}.pp.gx{background:#EEF0F8;color:#4A5A9A}
.pp.hd{background:none!important;border:0!important;box-shadow:none;color:var(--sub);font-size:10.5px;padding:0!important;margin-top:0;cursor:default;white-space:nowrap;overflow:visible;text-align:center}
.gt.v{grid-template-columns:1fr 18px 1fr;gap:6px}.vsc{align-self:center;text-align:center;color:var(--sub);font-size:12px;font-weight:600;padding-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"><div><p id="popmsg"></p><input id="popin" maxlength="30" style="display:none;margin:0 0 6px"><button id="popok">확인</button><button class="ghost" id="popno" style="display:none">취소</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc as _setDoc,collection,query,where,getDocs,writeBatch as _writeBatch,serverTimestamp,limit,onSnapshot,runTransaction,Timestamp,updateDoc as _updateDoc,deleteDoc as _deleteDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {getAI,getGenerativeModel,GoogleAIBackend} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";
import {initializeAppCheck,ReCaptchaEnterpriseProvider} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js";
import {firebaseConfig} from "./firebase-config.js";
const pvHold=()=>{pop("미리보기 중에는 저장되지 않아요. 위쪽 띠의 '끝내기'를 누르면 원래 화면으로 돌아가요.");return new Promise(()=>{})};
const setDoc=(...a)=>S.pv?pvHold():_setDoc(...a),updateDoc=(...a)=>S.pv?pvHold():_updateDoc(...a),deleteDoc=(...a)=>S.pv?pvHold():_deleteDoc(...a),writeBatch=d=>{const b=_writeBatch(d);if(S.pv)b.commit=pvHold;return b};
import * as CFG from "./firebase-config.js";

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAX_CREATE=2, MAX_JOIN=10;
const S={user:null,profile:null,screen:"login",clubs:[],found:[],form:{vis:"public",join:"open",pos:"either",play:"play",np:"1",days:[]},cur:null,tab:"today",q:null,qsel:null,qend:null,qarr:false,pv:null,dp:null,exp:null,pmo:null,pe:null,soff:[],ms:null,ph:null,pg:[],pp:[],pclubs:[],ptab:"home",pq:"",pd:null,sd:null,games:[],ap:[],ge:null,sel:null,mdt:null,still:0,dr:null,sess:null,parts:[],mem:[],apps:[]};
let auth,db,app;const AI_MODEL="gemini-3.5-flash";

function pop(msg){$("#popmsg").textContent=msg;$("#pop").style.display="flex"}
const base=()=>$("#pop").style.display="none";$("#popok").onclick=base;
const ask=(m,ok="확인",no="취소")=>new Promise(r=>{$("#popmsg").textContent=m;$("#popok").textContent=ok;$("#popno").textContent=no;$("#popno").style.display="block";$("#pop").style.display="flex";const d=v=>{base();$("#popok").textContent="확인";$("#popno").style.display="none";$("#popok").onclick=base;r(v)};$("#popok").onclick=()=>d(true);$("#popno").onclick=()=>d(false)});
const askText=(m,v="")=>new Promise(r=>{const pi=$("#popin");$("#popmsg").textContent=m;pi.style.display="block";pi.value=v;$("#popok").textContent="확인";$("#popno").textContent="취소";$("#popno").style.display="block";$("#pop").style.display="flex";setTimeout(()=>pi.focus(),60);const d=x=>{base();pi.style.display="none";$("#popno").style.display="none";$("#popok").onclick=base;r(x)};$("#popok").onclick=()=>d(pi.value);$("#popno").onclick=()=>d(null)});
const ROOT=["login","name","mode"];
const go=async(screen,extra={})=>{Object.assign(S,extra,{screen});if(screen!=="clubHome")qUnsub();if(!ROOT.includes(screen)&&!(history.state&&history.state.r===2))history.pushState({r:2},"");if(screen!=="login"&&screen!=="name")localStorage.setItem("cm_screen",screen==="clubHome"?"clubs":screen);render()};

try{ app=initializeApp(firebaseConfig);if(CFG.appCheckKey)try{initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(CFG.appCheckKey),isTokenAutoRefreshEnabled:true})}catch(e){console.warn(e)}auth=getAuth(app);db=getFirestore(app); }catch(e){ $("#app").innerHTML="<h1>설정 필요</h1><p>firebase-config.js 를 확인하세요.</p>"; }
if(auth) onAuthStateChanged(auth,async u=>{
  S.user=u; if(!u){S.profile=null;return go("login")}
  const snap=await getDoc(doc(db,"users",u.uid));
  if(!snap.exists()){S.profile={name:u.displayName||""};return go("name")}
  S.profile=snap.data();
  const m=localStorage.getItem("cm_mode"); if(m==="club")return openClubs(); if(m==="personal")return A.modePersonal(); go("mode");
});

function pvEnd(){if(S.pv&&S.cur){S.cur.role=S.cur.realRole||S.cur.role;delete S.cur.realRole}S.pv=null}
async function openClubs(){pvEnd();
  await go("clubs");
  const ms=await getDocs(query(collection(db,"clubMembers"),where("uid","==",S.user.uid),where("status","==","active")));
  const list=[];
  for(const m of ms.docs){const c=await getDoc(doc(db,"clubs",m.data().clubId)); if(c.exists())list.push({id:c.id,role:m.data().role,...c.data()})}
  S.clubs=list; render();
}
async function load(){const c=S.cur,id=c.id,q=(n,...w)=>getDocs(query(collection(db,n),...w.map(([f,v])=>where(f,"==",v)))).then(r=>r.docs.map(d=>({...d.data(),_id:d.id})).filter(x=>!x.deleted));
 {const m0=nextMeeting(c);if(S.tab==="today"&&m0&&m0.today&&eff(c).mode==="queue")qSub(`${id}_${ymd(m0.date)}`);else qUnsub()}
 if(S.tab==="today"){const m=nextMeeting(c);S.parts=m?await q("sessionParticipants",["clubId",id],["date",ymd(m.date)]):[];S.sess=null;S.sessMeta=null;S.mem=await q("clubMembers",["clubId",id],["status","active"]);
  if(m)try{const d=await getDoc(doc(db,"sessions",`${id}_${ymd(m.date)}`));const x=d.exists()?d.data():null;S.sessMeta=x;S.sess=x&&x.rounds?x:null}catch(e){}}
 if(S.tab==="settings")S.mem=await q("clubMembers",["clubId",id],["status","active"]);
 if(S.tab==="stats"||S.tab==="games")S.ap=await syncQ(`${S.user.uid}_cp_${id}`,"sessionParticipants",[["clubId","==",id]]);
 if(S.tab==="games"||S.tab==="stats"){const m=nextMeeting(c);S.mem=await q("clubMembers",["clubId",id],["status","active"]);S.sess=null;
  if(m)try{const d=await getDoc(doc(db,"sessions",`${id}_${ymd(m.date)}`));const x=d.exists()?d.data():null;S.sessMeta=x;S.sess=x&&x.rounds?x:null}catch(e){}
  S.games=(await syncQ(`${S.user.uid}_cg_${id}`,"games",[["clubId","==",id]])).map(x=>({...x,id:x.id||x._id})).sort((a,b)=>b.date.localeCompare(a.date)||(b.round||0)-(a.round||0)||(a.court||0)-(b.court||0));pkFill()}
 if(S.tab==="members"){S.mem=await q("clubMembers",["clubId",id],["status","active"]);S.apps=can("members")?await q("clubApplications",["clubId",id],["status","pending"]):[]}
 render()}
async function archiveClosed(clubs){const u=S.user.uid,ar={...(S.profile.archived||{})},sy=S.profile.sync||{};let ch=false;
 for(const c of clubs)if(c.status==="closed"&&sy[c.id]&&!ar[c.id]){const gs=(await getDocs(query(collection(db,"games"),where("clubId","==",c.id)))).docs.map(d=>({id:d.id,...d.data()})).filter(g=>!g.deleted&&[...g.t1,...g.t2].some(p=>p.k===u));
  const ovs=(await getDocs(query(collection(db,"personalGames"),where("ownerUid","==",u)))).docs.map(d=>d.data()).filter(x=>x.sourceType==="club");for(const g of gs){const f=g.t1.some(p=>p.k===u);await setDoc(doc(db,"personalGames",`${u}_k_${g.id}`),{ownerUid:u,sport:"tennis",date:g.date,sourceType:"other",label:c.name,t1:mf(f?g.t1:g.t2,u),t2:f?g.t2:g.t1,scoreA:f?g.scoreA:g.scoreB,scoreB:f?g.scoreB:g.scoreA,note:"",clubId:c.id,...(o=>o?{kind:o.kind||"",court:o.court||"",mtype:o.mtype||"doubles",note:o.note||""}:{})(ovs.find(x=>x.clubGameId===g.id)),createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}
  ar[c.id]=true;ch=true}
 if(ch){S.profile.archived=ar;await updateDoc(doc(db,"users",u),{archived:ar}).catch(()=>{})}}
const loadClubs=async()=>{const ms=await getDocs(query(collection(db,"clubMembers"),where("uid","==",S.user.uid),where("status","==","active"))),l=[];for(const m of ms.docs){const c=await getDoc(doc(db,"clubs",m.data().clubId));if(c.exists())l.push({id:c.id,...c.data()})}return l};

  const dy=e.target.closest("[data-d]");if(dy){const n=+dy.dataset.d,a=S.form.days;S.form.days=a.includes(n)?a.filter(x=>x!==n):[...a,n];dy.classList.toggle("on");return}
  const seg=e.target.closest(".seg div[data-v]");if(seg){const vals=[...document.querySelectorAll("#app [id]")].filter(x=>"value" in x).map(x=>[x.id,x.value]);S.form[seg.parentNode.dataset.k]=seg.dataset.v;render();vals.forEach(([i,v])=>{const x=document.getElementById(i);if(x)x.value=v});return}
  const el=e.target.closest("[data-a]");if(el&&(el.dataset.a==="mclose"||el.dataset.a==="msx"||el.dataset.a==="pex"||el.dataset.a==="pmx"||el.dataset.a==="expx"||el.dataset.a==="qx"||el.dataset.a==="qax"||el.dataset.a==="omx")&&el.classList.contains("sh")&&e.target.closest("[data-keep]"))return;if(el&&A[el.dataset.a])A[el.dataset.a](el)});

  if(S.omrg||S.qarr||S.qend!=null||S.exp||S.mdt||S.sd||S.ms||S.pe||S.pmo||(S.ph&&S.ph.zoom)){S.omrg=S.exp=S.mdt=S.sd=S.ms=S.pe=S.pmo=S.qend=null;S.qarr=false;if(S.ph)S.ph.zoom=0;S.still=1;render();S.still=0}
  else{const f=BACK[S.screen];if(f)f()}
  if(!ROOT.includes(S.screen)&&!(history.state&&history.state.r===2))history.pushState({r:2},"")});
