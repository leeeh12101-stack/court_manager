<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Court Manager</title>
<meta name="theme-color" content="#174A43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F6F7F5;--card:#fff;--tx:#202522;--sub:#747A76;--main:#174A43;--pt:#B8C96B;--line:#E3E6E3;--off:#D9DCDA;--tint:#EEF2E2;--sh:0 1px 2px rgba(23,74,67,.06),0 8px 22px rgba(23,74,67,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 18px 0}
.scr{flex:1;display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 4px}h2{font-size:16px;margin:22px 0 8px}
.hi{color:var(--sub);margin:0 0 18px}
.card{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--sh);transition:transform .12s}
.tap{cursor:pointer}.tap:active{transform:scale(.985)}
.sub{color:var(--sub);font-size:13px}
button{font:inherit;font-weight:600;border:0;border-radius:16px;padding:15px 16px;width:100%;margin-top:10px;cursor:pointer;background:var(--main);color:#fff;transition:transform .12s,opacity .12s}
button:active{transform:scale(.98);opacity:.92}
button.ghost{background:#fff;color:var(--main);box-shadow:var(--sh)}
button.link{background:none;color:var(--sub);width:auto;padding:8px 0;font-weight:500;box-shadow:none}
button:disabled{background:var(--off)}
input,select,textarea{font:inherit;width:100%;padding:14px;border:1.5px solid transparent;border-radius:14px;background:#fff;box-shadow:var(--sh);margin:6px 0 14px;outline:0}
input:focus,textarea:focus{border-color:var(--pt)}
.seg{display:flex;gap:8px;margin:6px 0 14px}.seg div{flex:1;text-align:center;padding:12px 4px;border-radius:14px;background:#fff;box-shadow:var(--sh);cursor:pointer;transition:background .15s}
.seg .on{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--pt);color:var(--main);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--main);font-weight:600}
.av{width:42px;height:42px;border-radius:14px;background:var(--tint);color:var(--main);display:grid;place-items:center;font-weight:700;flex:none}
.grow{flex:1}
.bar{position:sticky;bottom:0;margin:auto -18px 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(246,247,245,0))}
.bar button:first-child{margin-top:0}
.hero{background:var(--main);color:#fff;box-shadow:0 10px 26px rgba(23,74,67,.28)}
.hero .sub{color:#cfe0c0}
.logo{width:96px;height:96px;border-radius:24px;display:block;margin:0 auto 16px;box-shadow:var(--sh)}
.mid{margin:auto 0}.center{text-align:center}
#pop{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
#pop div{background:#fff;border-radius:20px;padding:20px;max-width:340px;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:#fff;box-shadow:0 -6px 22px rgba(23,74,67,.08);padding-bottom:env(safe-area-inset-bottom);border-radius:20px 20px 0 0;z-index:5}
.nav div{flex:1;text-align:center;padding:15px 0;color:var(--sub);cursor:pointer}.nav .on{color:var(--main);font-weight:700}
.sm{width:auto!important;margin:0!important;padding:9px 15px!important}
.list{background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);min-height:42px}.li:last-child{border:0}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.li .tm{color:var(--sub);font-size:13px;white-space:nowrap}.li .pill{font-size:11px;padding:2px 8px;white-space:nowrap}
.av.s{width:28px;height:28px;border-radius:9px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"><div><p id="popmsg"></p><button id="popok">확인</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,getDocs,writeBatch,serverTimestamp,limit,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAX_CREATE=2, MAX_JOIN=10;
const S={user:null,profile:null,screen:"login",clubs:[],found:[],form:{vis:"public",join:"open",pos:"either",play:"play",np:"1",days:[]},cur:null,tab:"today",parts:[],mem:[],apps:[]};
let auth,db;

function pop(msg){$("#popmsg").textContent=msg;$("#pop").style.display="flex"}
$("#popok").onclick=()=>$("#pop").style.display="none";
const go=async(screen,extra={})=>{Object.assign(S,extra,{screen});if(screen!=="login"&&screen!=="name")localStorage.setItem("cm_screen",screen==="clubHome"?"clubs":screen);render()};

try{ auth=getAuth(initializeApp(firebaseConfig)); db=getFirestore(); }catch(e){ $("#app").innerHTML="<h1>설정 필요</h1><p>firebase-config.js 를 확인하세요.</p>"; }
if(auth) onAuthStateChanged(auth,async u=>{
  S.user=u; if(!u){S.profile=null;return go("login")}
  const snap=await getDoc(doc(db,"users",u.uid));
  if(!snap.exists()){S.profile={name:u.displayName||""};return go("name")}
  S.profile=snap.data();
  const m=localStorage.getItem("cm_mode"); if(m==="club")return openClubs(); if(m==="personal")return go("personal"); go("mode");
});

async function openClubs(){
  await go("clubs");
  const ms=await getDocs(query(collection(db,"clubMembers"),where("uid","==",S.user.uid),where("status","==","active")));
  const list=[];
  for(const m of ms.docs){const c=await getDoc(doc(db,"clubs",m.data().clubId)); if(c.exists())list.push({id:c.id,role:m.data().role,...c.data()})}
  S.clubs=list; render();
}
async function load(){const c=S.cur,id=c.id,q=(n,...w)=>getDocs(query(collection(db,n),...w.map(([f,v])=>where(f,"==",v)))).then(r=>r.docs.map(d=>d.data()));
 if(S.tab==="today"){const m=nextMeeting(c);S.parts=m?await q("sessionParticipants",["clubId",id],["date",ymd(m.date)]):[]}
 if(S.tab==="members"){S.mem=await q("clubMembers",["clubId",id],["status","active"]);S.apps=c.role==="admin"?await q("clubApplications",["clubId",id],["status","pending"]):[]}
 render()}
const created=()=>S.clubs.filter(c=>c.createdBy===S.user.uid).length;
const joined=()=>S.clubs.length-created();
const code=()=>Array.from({length:7},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");

const POS={fore:"포",back:"백",either:"포or백"},DOW="일월화수목금토";
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const isSt=()=>["admin","staff"].includes(S.cur.role);
function nextMeeting(c){const days=c.regularDays||[],n=new Date();if(!days.length)return null;for(let i=0;i<8;i++){const x=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(days.includes(x.getDay()))return{date:x,today:i===0}}}
const btn=(a,id,t,g)=>`<button class="sm ${g?"ghost":""}" data-a="${a}" data-id="${id}">${t}</button>`;
const T={
today:()=>{const c=S.cur,m=nextMeeting(c);if(!m)return `<div class="card center" style="padding:28px"><b>정기 모임이 없어요</b><div class="sub">${c.role==="admin"?"설정에서 모임 요일을 정해 주세요.":"관리자가 모임 요일을 정하면 보여요."}</div></div>`;
 const mine=S.parts.find(p=>p.uid===S.user.uid),yes=S.parts.filter(p=>p.status==="in"),no=S.parts.filter(p=>p.status==="out");
 return `<div class="card hero" style="padding:20px"><div class="sub">${m.today?"오늘의 모임":"다음 모임"}</div><div style="font-size:24px;font-weight:700">${m.date.getMonth()+1}월 ${m.date.getDate()}일 (${DOW[m.date.getDay()]})</div><div class="sub">${c.regularStartTime||"13:00"}–${c.regularEndTime||"16:00"} · ${c.regularCourtCount||3}코트</div></div>
<div class="card row"><div><b>내 참석</b><div class="sub">${mine?(mine.status==="in"?`${mine.start}–${mine.end} · ${POS[mine.position]}${mine.noPlay?" · 놀참":""}`:"불참"):"아직 응답하지 않았어요"}</div></div><button class="sm" data-a="toAttend">${mine?"수정":"참석 등록"}</button></div>
<h2>참석 ${yes.length}명 · 불참 ${no.length}명</h2>
${yes.length?`<div class="list">${yes.map(p=>`<div class="li"><span class="nm">${esc(p.name)}</span>${p.guest?'<span class="pill">게스트</span>':""}<span class="tm">${p.start}–${p.end}</span><span class="pill">${p.noPlay?"놀참":POS[p.position]}</span></div>`).join("")}</div>`:""}
${isSt()?'<button class="ghost" data-a="toGuest">게스트 추가</button>':""}`},
members:()=>{const adm=S.cur.role==="admin";return `${adm&&S.apps.length?`<h2>가입 신청 ${S.apps.length}</h2>${S.apps.map(a=>`<div class="card row"><b>${esc(a.displayName)}</b><div style="display:flex;gap:6px">${btn("approve",a.uid,"승인")}${btn("reject",a.uid,"거절",1)}</div></div>`).join("")}`:""}
<h2>회원 ${S.mem.length}명</h2><div class="list">${S.mem.map(m=>{const t=adm&&m.uid!==S.user.uid&&m.role!=="admin";return `<div class="li ${t?"tap":""}" ${t?`data-a="role" data-id="${m.uid}"`:""}><div class="av s">${esc([...m.displayName][0])}</div><span class="nm">${esc(m.displayName)}</span>${m.role!=="member"?`<span class="pill">${m.role==="admin"?"관리자":"운영진"}</span>`:""}</div>`}).join("")}</div>${adm?'<div class="sub center">회원을 누르면 운영진으로 지정하거나 해제해요</div>':""}`},
settings:()=>{const c=S.cur;return `<div class="card"><b>정기 모임</b><div class="seg" style="margin-top:10px">${[...DOW].map((d,i)=>`<div data-d="${i}" class="${S.form.days.includes(i)?"on":""}">${d}</div>`).join("")}</div>
시작<input id="st" type="time" value="${c.regularStartTime||"13:00"}">종료<input id="et" type="time" value="${c.regularEndTime||"16:00"}">
코트 수<input id="cc" type="number" min="1" max="12" value="${c.regularCourtCount||3}">회차 간격(분)<input id="ri" type="number" min="20" max="90" value="${c.roundInterval||40}">
놀참<div class="seg" data-k="np"><div data-v="1" class="${S.form.np==="1"?"on":""}">사용</div><div data-v="0" class="${S.form.np==="0"?"on":""}">사용 안 함</div></div><button data-a="saveSettings">저장</button></div>
<div class="card"><div class="sub">초대코드</div><b id="invc" style="font-size:20px;letter-spacing:.12em">…</b></div>`}};
const V={
login:()=>`<div class="mid center"><img class="logo" src="icon-192.png" alt=""><h1>Court Manager</h1><p class="hi">테니스 클럽 운영과 내 경기 기록</p></div><div class="bar"><button data-a="login">Google로 시작</button></div>`,
name:()=>`<h1>이름 설정</h1><div class="card"><div class="sub">Google 이름</div><b>${esc(S.profile.name||"(없음)")}</b></div>
<p class="sub">경기 기록이 누구 것인지 알아보기 쉽도록 실명 사용을 권장합니다. 나중에 바꿀 수 있습니다.</p>
<input id="nm" value="${esc(S.profile.name)}" maxlength="20"><div class="bar"><button data-a="saveName">시작하기</button></div>`,
mode:()=>`<h1>안녕하세요, ${esc(S.profile.name)}님</h1><p class="hi">오늘은 어떤 모드로 시작할까요?</p>
<div class="card hero tap" data-a="modeClub" style="padding:22px 18px"><b style="font-size:18px">클럽</b><div class="sub">모임, 대진, 경기 결과</div></div>
<div class="card tap" data-a="modePersonal" style="padding:22px 18px"><b style="font-size:18px">개인</b><div class="sub">내 경기 기록과 메모</div></div>
<div class="bar"><button class="link" data-a="logout" style="margin:0 auto;display:block">로그아웃</button></div>`,
clubs:()=>`<div class="row"><h1>내 클럽</h1><button class="link" data-a="toMode">모드 변경</button></div>
<p class="hi">가입 ${joined()}/${MAX_JOIN} · 생성 ${created()}/${MAX_CREATE}</p>
${S.clubs.map(c=>`<div class="card tap row" data-a="club" data-id="${c.id}"><div class="av">${esc([...c.name][0])}</div><div class="grow"><b>${esc(c.name)}</b><div class="sub">${esc(c.meetingLocation||"장소 미정")}</div></div>${c.role==="admin"?'<span class="pill">관리자</span>':""}</div>`).join("")||'<div class="card center" style="padding:32px 16px"><b>아직 클럽이 없어요</b><div class="sub">클럽을 만들거나 초대코드로 가입해 보세요.</div></div>'}
<div class="bar"><button data-a="toCreate">클럽 만들기</button><button class="ghost" data-a="toJoin">클럽 가입하기</button></div>`,
create:()=>`<button class="link" data-a="back">← 뒤로</button><h1>클럽 만들기</h1>
클럽 이름<input id="cn" maxlength="30">모임 장소<input id="cl" maxlength="40">설명 (선택)<textarea id="cd" rows="2" maxlength="100"></textarea>
공개 여부<div class="seg" data-k="vis"><div data-v="public" class="${S.form.vis==="public"?"on":""}">공개</div><div data-v="private" class="${S.form.vis==="private"?"on":""}">비공개</div></div>
가입 방법<div class="seg" data-k="join">${[["open","바로 가입"],["approval","가입 승인"],["invite","초대만"]].map(([v,t])=>`<div data-v="${v}" class="${S.form.join===v?"on":""}">${t}</div>`).join("")}</div>
<div class="bar"><button data-a="doCreate">만들기</button></div>`,
join:()=>`<button class="link" data-a="back">← 뒤로</button><h1>클럽 가입하기</h1>
초대코드<input id="ic" maxlength="8" style="text-transform:uppercase"><button data-a="byCode">코드로 가입</button>
<h2>공개 클럽</h2><input id="sq" placeholder="클럽 이름 검색"><button class="ghost" data-a="search">검색</button>
${S.found.map(c=>`<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="sub">${esc(c.meetingLocation||"")}</div></div><button style="width:auto;margin:0" data-a="join" data-id="${c.id}">${c.joinMethod==="open"?"가입":c.joinMethod==="approval"?"신청":"초대만"}</button></div></div>`).join("")}`,
clubHome:()=>{const c=S.cur,adm=c.role==="admin";return `<div class="row"><h1>${esc(c.name)}</h1><button class="link" data-a="back">내 클럽</button></div>${T[S.tab]()}<div style="height:90px"></div>
<nav class="nav">${[["today","오늘"],["members","회원"],...(adm?[["settings","설정"]]:[])].map(([k,t])=>`<div data-a="tab" data-k="${k}" class="${S.tab===k?"on":""}">${t}</div>`).join("")}</nav>`},
attend:()=>`<button class="link" data-a="toClub">← 뒤로</button><h1>참석</h1>시작<input id="st" type="time" value="${S.form.st}">종료<input id="et" type="time" value="${S.form.et}">
${S.cur.noPlayEnabled!==false?`<div class="seg" data-k="play"><div data-v="play" class="${S.form.play==="play"?"on":""}">경기 참여</div><div data-v="no" class="${S.form.play==="no"?"on":""}">놀참</div></div>`:""}
${S.form.play==="no"&&S.cur.noPlayEnabled!==false?"":`포지션<div class="seg" data-k="pos">${Object.entries(POS).map(([v,t])=>`<div data-v="${v}" class="${S.form.pos===v?"on":""}">${t}</div>`).join("")}</div>`}
<div class="bar"><button data-a="saveAttend" data-s="in">참석 저장</button><button class="ghost" data-a="saveAttend" data-s="out">불참</button></div>`,
guest:()=>`<button class="link" data-a="toClub">← 뒤로</button><h1>게스트 추가</h1>이름<input id="gn" maxlength="20">시작<input id="st" type="time" value="${S.form.st}">종료<input id="et" type="time" value="${S.form.et}">
포지션<div class="seg" data-k="pos">${Object.entries(POS).map(([v,t])=>`<div data-v="${v}" class="${S.form.pos===v?"on":""}">${t}</div>`).join("")}</div>
<div class="bar"><button data-a="addGuest">추가</button></div>`,
personal:()=>`<div class="row"><h1>개인</h1><button class="link" data-a="toMode">모드</button></div><p class="sub">개인 경기·메모는 다음 단계에서 추가됩니다.</p>`
};
function render(){ $("#app").innerHTML=V[S.screen]?`<div class="scr">${V[S.screen]()}</div>`:""; if(S.screen==="clubHome"&&S.tab==="settings")getDoc(doc(db,"clubPrivate",S.cur.id)).then(d=>{const e=$("#invc");if(e)e.textContent=d.data()?.inviteCode||"-"}).catch(()=>{}); }

async function addMember(clubId,extra={}){
  await setDoc(doc(db,"clubMembers",clubId+"_"+S.user.uid),{clubId,uid:S.user.uid,displayName:S.profile.name,photoURL:S.user.photoURL||"",role:"member",status:"active",defaultPosition:"either",tierId:null,joinedAt:serverTimestamp(),...extra});
}
const A={
async login(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){pop("로그인하지 못했습니다. 팝업 차단을 해제하고 다시 시도해 주세요.")}},
async logout(){localStorage.removeItem("cm_mode");await signOut(auth)},
async saveName(){const n=$("#nm").value.trim();if(!n)return pop("이름을 입력해 주세요.");
  S.profile={name:n,email:S.user.email||"",photoURL:S.user.photoURL||""};
  await setDoc(doc(db,"users",S.user.uid),{uid:S.user.uid,...S.profile,createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});go("mode")},
toMode:()=>go("mode"),
modeClub(){localStorage.setItem("cm_mode","club");openClubs()},
modePersonal(){localStorage.setItem("cm_mode","personal");go("personal")},
back:()=>openClubs(),
toCreate(){if(created()>=MAX_CREATE)return pop(`클럽은 최대 ${MAX_CREATE}개까지 만들 수 있습니다.`);go("create")},
toJoin(){if(joined()>=MAX_JOIN)return pop(`클럽은 최대 ${MAX_JOIN}개까지 가입할 수 있습니다.`);go("join",{found:[]})},
club(el){S.cur=S.clubs.find(c=>c.id===el.dataset.id);S.tab="today";S.parts=[];go("clubHome");load()},
toClub(){go("clubHome");load()},
tab(el){S.tab=el.dataset.k;if(S.tab==="settings")S.form={...S.form,np:S.cur.noPlayEnabled===false?"0":"1",days:[...(S.cur.regularDays||[])]};render();load()},
toAttend(){const m=S.parts.find(p=>p.uid===S.user.uid),c=S.cur;S.form={...S.form,pos:m?.position||"either",play:m?.noPlay?"no":"play",st:m?.start||c.regularStartTime||"13:00",et:m?.end||c.regularEndTime||"16:00"};go("attend")},
toGuest(){S.form={...S.form,pos:"either",st:S.cur.regularStartTime||"13:00",et:S.cur.regularEndTime||"16:00"};go("guest")},
async saveAttend(el){const c=S.cur,m=nextMeeting(c),d=ymd(m.date),inn=el.dataset.s==="in";
  try{await setDoc(doc(db,"sessionParticipants",`${c.id}_${d}_${S.user.uid}`),{clubId:c.id,date:d,uid:S.user.uid,name:S.profile.name,status:el.dataset.s,start:inn?$("#st").value:"",end:inn?$("#et").value:"",position:inn&&S.form.play==="no"?"either":S.form.pos,noPlay:inn&&S.form.play==="no"&&c.noPlayEnabled!==false,guest:false,responseSource:"member",updatedAt:serverTimestamp()});A.toClub()}catch(e){pop("저장하지 못했습니다. 다시 시도해 주세요.")}},
async addGuest(){const n=$("#gn").value.trim();if(!n)return pop("게스트 이름을 입력해 주세요.");const c=S.cur,d=ymd(nextMeeting(c).date);
  try{await setDoc(doc(db,"sessionParticipants",`${c.id}_${d}_g${Date.now().toString(36)}`),{clubId:c.id,date:d,uid:null,name:n,status:"in",start:$("#st").value,end:$("#et").value,position:S.form.pos,noPlay:false,guest:true,responseSource:"admin",updatedAt:serverTimestamp()});A.toClub()}catch(e){pop("추가하지 못했습니다.")}},
async approve(el){const a=S.apps.find(x=>x.uid===el.dataset.id),c=S.cur;
  try{await setDoc(doc(db,"clubMembers",`${c.id}_${a.uid}`),{clubId:c.id,uid:a.uid,displayName:a.displayName,photoURL:"",role:"member",status:"active",defaultPosition:"either",tierId:null,joinedAt:serverTimestamp()});
  await updateDoc(doc(db,"clubApplications",`${c.id}_${a.uid}`),{status:"approved"});load()}catch(e){pop("승인하지 못했습니다.")}},
async reject(el){try{await updateDoc(doc(db,"clubApplications",`${S.cur.id}_${el.dataset.id}`),{status:"rejected"});load()}catch(e){pop("처리하지 못했습니다.")}},
async role(el){const m=S.mem.find(x=>x.uid===el.dataset.id),r=m.role==="staff"?"member":"staff";
  try{await updateDoc(doc(db,"clubMembers",`${S.cur.id}_${m.uid}`),{role:r});load()}catch(e){pop("변경하지 못했습니다.")}},
async saveSettings(){const v={regularDays:[...S.form.days].sort(),regularStartTime:$("#st").value,regularEndTime:$("#et").value,regularCourtCount:+$("#cc").value||3,roundInterval:+$("#ri").value||40,noPlayEnabled:S.form.np==="1"};
  try{await updateDoc(doc(db,"clubs",S.cur.id),v);Object.assign(S.cur,v);pop("저장했습니다.")}catch(e){pop("저장하지 못했습니다.")}},
async doCreate(){const name=$("#cn").value.trim();if(!name)return pop("클럽 이름을 입력해 주세요.");
  const id=doc(collection(db,"clubs")).id,ic=code(),uid=S.user.uid,b=writeBatch(db);
  b.set(doc(db,"clubs",id),{name,meetingLocation:$("#cl").value.trim(),description:$("#cd").value.trim(),visibility:S.form.vis,joinMethod:S.form.join,primaryAdminId:uid,createdBy:uid,noPlayEnabled:true,tierEnabled:false,regularCourtCount:3,roundInterval:40,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  b.set(doc(db,"clubMembers",id+"_"+uid),{clubId:id,uid,displayName:S.profile.name,photoURL:S.user.photoURL||"",role:"admin",status:"active",defaultPosition:"either",tierId:null,joinedAt:serverTimestamp()});
  b.set(doc(db,"clubPrivate",id),{inviteCode:ic});b.set(doc(db,"inviteCodes",ic),{clubId:id});
  try{await b.commit();openClubs()}catch(e){pop("클럽을 만들지 못했습니다. Firestore 규칙이 게시되었는지 확인해 주세요.")}},
async search(){const q=$("#sq").value.trim().toLowerCase();
  const r=await getDocs(query(collection(db,"clubs"),where("visibility","==","public"),limit(50)));
  S.found=r.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!q||c.name.toLowerCase().includes(q));render()},
async join(el){const c=S.found.find(x=>x.id===el.dataset.id);
  try{
    if(c.joinMethod==="open"){await addMember(c.id);openClubs()}
    else if(c.joinMethod==="approval"){await setDoc(doc(db,"clubApplications",c.id+"_"+S.user.uid),{clubId:c.id,uid:S.user.uid,displayName:S.profile.name,status:"pending",createdAt:serverTimestamp()});pop("가입을 신청했습니다. 관리자 승인을 기다려 주세요.")}
    else pop("초대코드로만 가입할 수 있는 클럽입니다.");
  }catch(e){pop("가입하지 못했습니다. 이미 가입했거나 신청한 클럽일 수 있습니다.")}},
async byCode(){const ic=$("#ic").value.trim().toUpperCase();if(!ic)return;
  try{const d=await getDoc(doc(db,"inviteCodes",ic));if(!d.exists())return pop("초대코드를 찾을 수 없습니다.");
    await addMember(d.data().clubId,{viaCode:ic});openClubs()}catch(e){pop("가입하지 못했습니다. 이미 가입한 클럽일 수 있습니다.")}}
};
document.addEventListener("click",e=>{
  const dy=e.target.closest("[data-d]");if(dy){const n=+dy.dataset.d,a=S.form.days;S.form.days=a.includes(n)?a.filter(x=>x!==n):[...a,n];dy.classList.toggle("on");return}
  const seg=e.target.closest(".seg div[data-v]");if(seg){const vals=[...document.querySelectorAll("#app [id]")].filter(x=>"value" in x).map(x=>[x.id,x.value]);S.form[seg.parentNode.dataset.k]=seg.dataset.v;render();vals.forEach(([i,v])=>{const x=document.getElementById(i);if(x)x.value=v});return}
  const el=e.target.closest("[data-a]");if(el&&A[el.dataset.a])A[el.dataset.a](el)});
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script>
</body>
